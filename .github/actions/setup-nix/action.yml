name: Setup Nix
description: Install Nix and optionally configure Cachix

inputs:
  github-token:
    description: "GitHub token passed to install-nix-action"
    required: false
  cachix-token:
    description: "Cachix auth token. If provided, Cachix is configured"
    required: false
  push-to-cachix:
    description: "Whether to push store paths to Cachix"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: Setup Cachix
      if: inputs.cachix-token != ''
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: go-overlay
        authToken: ${{ inputs.cachix-token }}
        skipPush: ${{ inputs.push-to-cachix != 'true' }}
        useDaemon: false
