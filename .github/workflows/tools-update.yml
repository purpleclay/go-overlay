name: tools-update
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to update (blank = all)"
        required: false
        type: choice
        options:
          - ""
          - delve
          - gofumpt
          - golangci-lint
          - gopls
          - govulncheck
          - staticcheck

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tool || 'all' }}
  cancel-in-progress: false

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-26.04
    name: setup
    outputs:
      matrix: ${{ steps.matrix.outputs.tools }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: build_tool_matrix
        id: matrix
        env:
          TOOL_INPUT: ${{ inputs.tool }}
        run: |
          tools='[
            { "name": "delve", "module": "github.com/go-delve/delve", "sub-packages": "cmd/dlv" },
            { "name": "gofumpt", "module": "mvdan.cc/gofumpt", "sub-packages": "." },
            { "name": "golangci-lint", "module": "github.com/golangci/golangci-lint/v2", "sub-packages": "cmd/golangci-lint" },
            { "name": "gopls", "module": "golang.org/x/tools/gopls", "sub-packages": "." },
            { "name": "govulncheck", "module": "golang.org/x/vuln", "sub-packages": "cmd/govulncheck" },
            { "name": "staticcheck", "module": "honnef.co/go/tools", "sub-packages": "cmd/staticcheck" }
          ]'

          if [ -n "${TOOL_INPUT}" ]; then
            tools=$(echo "$tools" | jq -c --arg name "${TOOL_INPUT}" '[.[] | select(.name == $name)]')
          fi

          echo "tools=$(echo "$tools" | jq -c)" >> "$GITHUB_OUTPUT"

  update:
    needs: setup
    runs-on: ubuntu-26.04
    name: update / ${{ matrix.tool.name }}
    permissions:
      contents: read # writes go through secrets.GH_NSV, not GITHUB_TOKEN; this only covers setup_nix's API calls
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_NSV }}
          # relied on by the later git push/gh pr create steps
          persist-credentials: true

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-token: ${{ secrets.GH_CACHIX }}

      - name: detect_latest_version
        id: detect
        env:
          TOOL_MODULE: ${{ matrix.tool.module }}
        run: |
          version=$(nix run .#goscrape -- mod-proxy detect "${TOOL_MODULE}" --include-prerelease)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: generate_manifest
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NSV }}
          DETECTED_VERSION: ${{ steps.detect.outputs.version }}
          TOOL_NAME: ${{ matrix.tool.name }}
          TOOL_MODULE: ${{ matrix.tool.module }}
          TOOL_SUB_PACKAGES: ${{ matrix.tool.sub-packages }}
        run: |
          version="${DETECTED_VERSION}"
          name="${TOOL_NAME}"
          manifest="manifests/${name}/${version#v}.nix"
          branch="nix-tool-${name}-${version#v}"

          if [ -f "$manifest" ]; then
            echo "Manifest already exists for ${name} ${version}"
            exit 0
          fi

          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -q '[1-9]'; then
            echo "PR already exists for ${name} ${version}"
            exit 0
          fi

          nix run .#goscrape -- mod-proxy generate "${TOOL_MODULE}" \
            --sub-packages "${TOOL_SUB_PACKAGES}" \
            --versions "${version}" \
            --output "manifests/${name}"

          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: import_gpg
        if: steps.generate.outputs.generated == 'true'
        uses: purpleclay/gpg-import-action@b3678ccc1d6c597a08e9e6e32c17e974eb7bf9c8 # v0.2.0
        with:
          key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: approver_token
        if: steps.generate.outputs.generated == 'true'
        id: approver
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APPROVER_CLIENT_ID }}
          private-key: ${{ secrets.APPROVER_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: create_pr
        if: steps.generate.outputs.generated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_NSV }}
          APPROVER_TOKEN: ${{ steps.approver.outputs.token }}
          TOOL_NAME: ${{ matrix.tool.name }}
          GENERATED_VERSION: ${{ steps.generate.outputs.version }}
          GENERATED_MANIFEST: ${{ steps.generate.outputs.manifest }}
          GENERATED_BRANCH: ${{ steps.generate.outputs.branch }}
        run: |
          name="${TOOL_NAME}"
          version="${GENERATED_VERSION}"
          manifest="${GENERATED_MANIFEST}"
          branch="${GENERATED_BRANCH}"

          git checkout -b "$branch"
          git add "$manifest" "manifests/${name}/index.nix"
          git commit -s -m "chore(tool): generated nix manifest for ${name} ${version#v}"
          git push -u origin "$branch"

          gh pr create \
            --title "chore(tool): add ${name} ${version#v} manifest" \
            --body "Auto-generated nix manifest for ${name} ${version}." \
            --base main \
            --head "$branch"

          GH_TOKEN="$APPROVER_TOKEN" gh pr review "$branch" --approve

          # enablePullRequestAutoMerge only succeeds while something is still
          # pending; if checks already completed by this point, the PR is
          # already mergeable and --auto is rejected, so merge directly.
          if ! gh pr merge --auto --squash "$branch"; then
            gh pr merge --squash "$branch"
          fi
