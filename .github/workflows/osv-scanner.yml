name: osv-scanner
on:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            ghcr.io:443
            github.com:443
            proxy.golang.org:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: scan
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --experimental-plugins=github/actions
            --experimental-exclude=test/fixtures
            --experimental-exclude=g:**/testdata/**
            -r
            ./
        continue-on-error: true

      - name: check_scan_completed
        if: ${{ steps.scan.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [ ! -s results.json ]; then
            echo "::error::osv-scanner failed without writing results.json, so there are no results to report on."
            exit 1
          fi

      - name: report
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: upload_sarif
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
