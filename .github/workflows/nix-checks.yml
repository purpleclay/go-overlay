name: nix-checks
on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "default.nix"
      - "lib/**"
      - "builder/**"
      - "test/**"
      - "examples/**"
      - "govendor.toml"
      # The goversions app and its renderer have their own checks, and every
      # Go release PR rewrites manifests/go/index.nix, whose consistency
      # checks must run on exactly those PRs.
      - "goversions.nix"
      - "scripts/**"
      - "manifests/go/**"
  pull_request:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "default.nix"
      - "lib/**"
      - "builder/**"
      - "test/**"
      - "examples/**"
      - "govendor.toml"
      # The goversions app and its renderer have their own checks, and every
      # Go release PR rewrites manifests/go/index.nix, whose consistency
      # checks must run on exactly those PRs.
      - "goversions.nix"
      - "scripts/**"
      - "manifests/go/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    name: checks / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}

      - name: run
        run: nix flake check
