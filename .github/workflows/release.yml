name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cafe.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: validate_tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The push.tags trigger above is a glob, not a SemVer check —
          # "v*.*.*" also matches non-numeric tags like "vfoo.bar.baz". Fail
          # closed here before generating notes or publishing a release.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not a valid release tag; expected vX.Y.Z (see RELEASE.md#versioning)"
            exit 1
          fi

      - name: verify_tag_signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # gh release create --verify-tag (below) only checks the tag
          # exists — it says nothing about who signed it. Only "purpleclay"
          # is an authorized signer; fetch that key alone into an isolated
          # keyring so any successful verification can only mean this tag
          # was signed by them, not just signed by *someone*.
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          gh api users/purpleclay/gpg_keys --jq '.[].raw_key' | gpg --batch --import
          if ! git verify-tag "$TAG"; then
            echo "::error::tag '$TAG' is not signed by an authorized signer (purpleclay)"
            exit 1
          fi

      - name: release_note
        uses: purpleclay/release-note-action@35a3b27b93d24ded4436b5266df8cccbbbe18d82 # v0.4.0
        with:
          # An existing release for the tag is left untouched: immutable
          # releases can't be replaced, only superseded by a new tag.
          publish: true
