name: govendor
on:
  pull_request:
    branches: [main]
    paths: ["**/go.mod", "**/go.sum"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect:
    name: detect
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout the PR diff to detect changed go.mod/go.sum dirs
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: detect_changed_modules
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dirs=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | awk '/(^|\/)go\.(mod|sum)$/{print}' \
            | xargs -r -n1 dirname | sort -u)

          {
            echo "dirs<<EOF"
            echo "$dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  vendor:
    needs: detect
    if: needs.detect.outputs.dirs != ''
    permissions:
      contents: read # passed through to govendor-update.yml, which pushes via its own token secret
    uses: $/.github/workflows/govendor-update.yml
    with:
      working-directory: ${{ needs.detect.outputs.dirs }}
    secrets:
      token: ${{ secrets.GH_NSV }}
      gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
