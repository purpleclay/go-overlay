name: nix-tools
on:
  push:
    branches:
      - main
    paths:
      - "manifests/delve/**"
      - "manifests/gofumpt/**"
      - "manifests/golangci-lint/**"
      - "manifests/gopls/**"
      - "manifests/govulncheck/**"
      - "manifests/staticcheck/**"
      - "lib/tool-manifests.nix"
      - "lib/mk-go-tool.nix"
      - "lib/mk-tool-set.nix"
  pull_request:
    branches:
      - main
    paths:
      - "manifests/delve/**"
      - "manifests/gofumpt/**"
      - "manifests/golangci-lint/**"
      - "manifests/gopls/**"
      - "manifests/govulncheck/**"
      - "manifests/staticcheck/**"
      - "lib/tool-manifests.nix"
      - "lib/mk-go-tool.nix"
      - "lib/mk-tool-set.nix"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  detect_changes:
    runs-on: ubuntu-24.04
    name: detect_changes
    permissions:
      contents: read
    outputs:
      tools: ${{ steps.filter.outputs.tools }}
      has-tools: ${{ steps.filter.outputs.has-tools }}
      shared: ${{ steps.changes.outputs.shared }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: generate_filters
        id: gen-filters
        run: |
          tools='["delve","gofumpt","golangci-lint","gopls","govulncheck","staticcheck"]'

          filters="shared:"
          filters="$filters
            - 'lib/tool-manifests.nix'
            - 'lib/mk-go-tool.nix'
            - 'lib/mk-tool-set.nix'"
          for name in $(echo "$tools" | jq -r '.[]'); do
            filters="$filters
          ${name}:
            - 'manifests/${name}/**'"
          done

          {
            echo "filters<<EOF"
            echo "$filters"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - name: detect_changed_paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: ${{ steps.gen-filters.outputs.filters }}

      - name: filter_changed_tools
        id: filter
        env:
          ALL_TOOLS: ${{ steps.gen-filters.outputs.tools }}
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          all_tools="$ALL_TOOLS"
          changes="$CHANGES"
          shared=$(echo "$changes" | jq 'any(. == "shared")')

          if [ "$shared" == "true" ]; then
            tools="$all_tools"
          else
            tools=$(echo "$all_tools" | jq -c --argjson changes "$changes" \
              '[.[] | select(. as $n | $changes | any(. == $n))]')
          fi

          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "has-tools=$(echo "$tools" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  build:
    needs: detect_changes
    if: needs.detect_changes.outputs.has-tools == 'true'
    runs-on: ${{ matrix.os }}
    name: build / ${{ matrix.tool }} / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        tool: ${{ fromJSON(needs.detect_changes.outputs.tools) }}
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}
          push-to-cachix: "true"

      - name: build (${{ matrix.tool }})
        env:
          TOOL: ${{ matrix.tool }}
        run: nix build ".#go.tools.${TOOL}.latest"

  build_with_default_tools:
    needs: detect_changes
    if: needs.detect_changes.outputs.shared == 'true'
    runs-on: ${{ matrix.os }}
    name: build_with_default_tools / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}
          push-to-cachix: "true"

      - name: build (withDefaultTools)
        run: nix build '.#go.withDefaultTools'
