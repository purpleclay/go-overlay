name: nix-packages
on:
  push:
    branches:
      - main
    paths:
      - "goscrape.nix"
      - "govendor.nix"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "govendor.toml"
      - "builder/**"
  pull_request:
    branches:
      - main
    paths:
      - "goscrape.nix"
      - "govendor.nix"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "govendor.toml"
      - "builder/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect_changes:
    runs-on: ubuntu-24.04
    name: detect_changes
    permissions:
      contents: read
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      goscrape: ${{ steps.changes.outputs.goscrape }}
      govendor: ${{ steps.changes.outputs.govendor }}
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed packages
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'govendor.toml'
              - 'internal/**'
              - 'builder/**'
            goscrape:
              - 'goscrape.nix'
              - 'cmd/goscrape/**'
            govendor:
              - 'govendor.nix'
              - 'cmd/govendor/**'

  build_goscrape:
    needs: detect_changes
    if: needs.detect_changes.outputs.goscrape == 'true' || needs.detect_changes.outputs.shared == 'true'
    runs-on: ${{ matrix.os }}
    name: build_goscrape / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}
          push-to-cachix: "true"

      - name: Build goscrape
        run: nix build .#goscrape

  build_govendor:
    needs: detect_changes
    if: needs.detect_changes.outputs.govendor == 'true' || needs.detect_changes.outputs.shared == 'true'
    runs-on: ${{ matrix.os }}
    name: build_govendor / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}
          push-to-cachix: "true"

      - name: Build govendor
        run: nix build .#govendor
