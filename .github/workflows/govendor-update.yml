name: govendor-update
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory (or newline-separated list of directories) for govendor manifest generation"
        required: false
        type: string
        default: "."
      co-author:
        description: "Co-author for the commit trailer (e.g., 'name <email>'). If not provided, uses git config from GPG import"
        required: false
        type: string
      app-client-id:
        description: "Client ID of a GitHub App to push the commit as, instead of the token secret. The app becomes the co-author unless co-author is set"
        required: false
        type: string
    secrets:
      token:
        description: "GitHub token with contents:write and workflows:write permissions to push commits. Not needed when app-client-id is set"
        required: false
      app-private-key:
        description: "Private key of the GitHub App identified by app-client-id"
        required: false
      gpg-private-key:
        description: "GPG private key for signing commits"
        required: true
      gpg-passphrase:
        description: "Passphrase for the GPG private key"
        required: true

permissions: {}

jobs:
  govendor:
    name: govendor
    runs-on: ubuntu-26.04
    permissions:
      contents: read # writes go through the app token or secrets.token, not GITHUB_TOKEN; this only covers Setup Nix's API calls
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: app_token
        if: inputs.app-client-id != ''
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          token: ${{ steps.app.outputs.token || secrets.token }}
          # relied on by the later git push --force-with-lease step
          persist-credentials: true

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: import_gpg
        uses: purpleclay/gpg-import-action@b3678ccc1d6c597a08e9e6e32c17e974eb7bf9c8 # v0.2.0
        with:
          key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}

      - name: generate_govendor_toml
        env:
          CO_AUTHOR: ${{ inputs.co-author }}
          DIRS: ${{ inputs.working-directory }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::govendor ($dir)"
            (cd "$dir" && nix run github:purpleclay/go-overlay#govendor) || {
              echo "::error::govendor failed for $dir"
              exit 1
            }
            echo "::endgroup::"

            git add "$dir/govendor.toml"
          done <<< "$DIRS"

          if git diff --cached --quiet; then
            echo "No changes to govendor.toml"
            exit 0
          fi

          if [ -z "$CO_AUTHOR" ] && [ -n "$APP_SLUG" ]; then
            bot="${APP_SLUG}[bot]"
            CO_AUTHOR="$bot <$(gh api "users/$bot" --jq .id)+$bot@users.noreply.github.com>"
          elif [ -z "$CO_AUTHOR" ]; then
            CO_AUTHOR="$(git config user.name) <$(git config user.email)>"
          fi

          git commit --amend --no-edit --trailer "Co-authored-by: $CO_AUTHOR"
          git push --force-with-lease
