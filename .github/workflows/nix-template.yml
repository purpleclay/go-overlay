name: nix-template
on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "builder/**"
      - "templates/**"
  pull_request:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "builder/**"
      - "templates/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  template_default:
    runs-on: ${{ matrix.os }}
    name: template_default / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}

      - name: scaffold
        run: nix flake new -t .#default /tmp/go-overlay-template

      - name: build_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix build --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-template

      # TODO: should this not just run the built binary?
      - name: verify_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix develop --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-template --command go version

  template_workspace:
    runs-on: ${{ matrix.os }}
    name: template_workspace / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}

      - name: scaffold
        run: nix flake new -t .#workspace /tmp/go-overlay-workspace-template

      # TODO: should this not just run the built binary?
      - name: build_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix build --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-workspace-template

      - name: verify_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix develop --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-workspace-template --command go version

  template_image:
    runs-on: ubuntu-24.04
    name: template_image
    permissions:
      contents: read
    steps:
      - name: harden_runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup_nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-token: ${{ secrets.GH_CACHIX }}

      - name: scaffold
        run: nix flake new -t .#image /tmp/go-overlay-image-template

      - name: build_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix build --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-image-template

      - name: build_template_image
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix build --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-image-template#image

      - name: verify_template
        env:
          GO_OVERLAY_PATH: ${{ github.workspace }}
        run: nix develop --override-input go-overlay "path:${GO_OVERLAY_PATH}" /tmp/go-overlay-image-template --command go version
